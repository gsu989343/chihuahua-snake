<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>吉娃娃貪吃蛇｜美化版</title>
<style>
:root{
  --wood:#f3d9ae;--wood2:#e8c38c;--paper:#f7f0e5;
  --brown:#70401f;--brown2:#9a6035;--line:#d2a36b;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:12px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#fae8ca,#e9c48e);
 font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--brown);
}
.game{
 width:min(100%,960px);background:var(--wood);border:4px solid #cfa06a;border-radius:30px;
 padding:15px;box-shadow:0 14px 35px rgba(80,45,20,.18);overflow:hidden;
}
.top{display:grid;grid-template-columns:1fr 180px 180px;gap:12px}
.title,.badge{
 border:3px solid var(--line);background:#fff7e7;border-radius:24px;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.8);
}
.title{min-height:90px;display:flex;align-items:center;padding:8px 18px;gap:12px}
.title img{width:78px;height:78px;object-fit:contain}
.title h1{margin:0;font-size:35px;letter-spacing:2px}
.badge{min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.badge .label{font-weight:900;font-size:19px}.badge .value{font-weight:900;font-size:31px;margin-top:2px}
.board{
 position:relative;margin-top:14px;border:4px solid #bd8d54;border-radius:25px;overflow:hidden;
 background:#f5eee2;box-shadow:inset 0 0 28px rgba(100,65,35,.08);
}
#gameCanvas{display:block;width:100%;height:auto;touch-action:none}
.overlay{
 position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 background:rgba(255,248,235,.74);backdrop-filter:blur(2px);z-index:10;
}
.card{
 background:#fff9ed;border:4px solid #c99b62;border-radius:30px;padding:26px 34px;text-align:center;
 box-shadow:0 12px 30px rgba(95,54,25,.18);max-width:86%;
}
.card h2{margin:0 0 8px;font-size:30px}.card p{margin:6px 0;font-size:18px}
button{font-family:inherit}
.restart{
 border:3px solid #d19d85;background:#ffe5df;color:#744735;border-radius:22px;
 padding:13px 23px;font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #cfaa91;
}
.restart:active{transform:translateY(2px);box-shadow:0 1px 0 #cfaa91}
.bottom{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:10px;align-items:center;padding-top:8px}
.tip{display:flex;align-items:center;gap:5px;min-height:100px}
.tip img{width:105px;height:105px;object-fit:contain}
.bubble{
 position:relative;background:#fff7e9;border:3px solid var(--line);border-radius:34px;
 padding:13px 17px;font-size:20px;font-weight:900;line-height:1.25;
}
.bubble:after{
 content:"";position:absolute;left:-17px;bottom:19px;border-width:9px 18px 9px 0;
 border-style:solid;border-color:transparent #fff7e9 transparent transparent;
}
.controls{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:7px;justify-content:center}
.ctrl{
 width:58px;height:58px;border:3px solid #c99b62;background:#fff8eb;border-radius:50%;
 font-size:30px;color:var(--brown);font-weight:900;cursor:pointer;box-shadow:0 3px 0 #c99b62;
}
.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
.actions{display:flex;justify-content:center;align-items:center;gap:12px}
.mobile{text-align:center;font-weight:800;font-size:17px}.mobile span{display:block;font-size:31px}
@media(max-width:760px){
 .game{padding:8px;border-radius:21px}.top{grid-template-columns:1fr 100px 100px;gap:5px}
 .title{min-height:72px;padding:5px 8px;gap:4px}.title img{width:60px;height:60px}.title h1{font-size:24px}
 .badge{min-height:72px;border-width:2px}.badge .label{font-size:13px}.badge .value{font-size:23px}
 .bottom{grid-template-columns:1fr 1fr}.tip{grid-column:1/3;justify-content:center;min-height:70px}
 .tip img{width:76px;height:76px}.bubble{font-size:17px;padding:8px 12px}
 .controls{grid-column:1}.actions{grid-column:2}.mobile{display:none}
}
</style>
</head>

let snake,dir,nextDir,food,score,running=false,dead=false;
let moveEvery=105,acc=0,last=0,progress=0,raf;
let prevSnake=[];

function reset(){
 snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10},{x:5,y:10}];
 prevSnake=snake.map(s=>({...s}));
 dir={x:1,y:0};nextDir={x:1,y:0};food=null;score=3;
 moveEvery=105;acc=0;progress=0;running=false;dead=false;placeFood();ui();draw(1);
 titleEl.textContent="🐶 吉娃娃貪吃蛇";
 p1.textContent="吃掉骨頭，讓吉娃娃一路變長！";
 p2.textContent="方向鍵、WASD、按鈕或手機滑動都可以玩";
 document.getElementById("startBtn").textContent="開始遊戲";
}
function ui(){scoreEl.textContent=score;lenEl.textContent=snake.length}
function placeFood(){
 do{food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}
 while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function setDir(name){
 const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
 const nd=m[name];if(!nd)return;
 if(nd.x===-dir.x&&nd.y===-dir.y)return;
 nextDir=nd;
}
function start(){
 if(dead)reset();
 running=true;overlay.style.display="none";last=performance.now();acc=0;progress=0;
 cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function loop(t){
 if(!running)return;
 const dt=Math.min(40,t-last);last=t;acc+=dt;
 while(acc>=moveEvery){acc-=moveEvery;step();if(!running)break}
 progress=acc/moveEvery;
 draw(progress);
 raf=requestAnimationFrame(loop);
}
function step(){
 dir=nextDir;
 prevSnake=snake.map(s=>({...s}));
 const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some((s,i)=>i>0&&s.x===head.x&&s.y===head.y)){
  end();return;
 }
 snake.unshift(head);
 if(head.x===food.x&&head.y===food.y){
  score++;moveEvery=Math.max(62,moveEvery-2);placeFood();ui();beep();
 }else snake.pop();
}
function interp(a,b,t){return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}
function posFor(i,t){
 const cur=snake[i]||snake[snake.length-1];
 const old=prevSnake[i]||cur;
 return interp(old,cur,t);
}
function angleBetween(a,b){
 return Math.atan2((b.y-a.y),(b.x-a.x));
}
function draw(t){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#f5eee2";ctx.fillRect(0,0,W,H);
 // subtle paper grain
 for(let i=0;i<800;i++){
  const x=(i*73)%W,y=(i*137)%H;
  ctx.fillStyle=i%3?"rgba(145,111,76,.035)":"rgba(255,255,255,.16)";
  ctx.fillRect(x,y,2,2);
 }
 // paw prints
 ctx.globalAlpha=.17;ctx.fillStyle="#8f603a";
 [[120,90],[655,125],[96,405],[535,455]].forEach(([x,y])=>{
  ctx.beginPath();ctx.arc(x,y+7,11,0,Math.PI*2);ctx.fill();
  [[-17,-10],[-5,-19],[9,-18],[19,-6]].forEach(([dx,dy])=>{
   ctx.beginPath();ctx.arc(x+dx,y+dy,5.5,0,Math.PI*2);ctx.fill();
  });
 });ctx.globalAlpha=1;

 // bone
 drawBone(food.x*C+C/2,food.y*C+C/2,.86);

 // body: each segment follows the actual local direction, so corners look natural
 for(let i=snake.length-1;i>=1;i--){
   const p=posFor(i,t);
   const next=posFor(Math.min(i+1,snake.length-1),t);
   const prev=posFor(Math.max(i-1,0),t);
   let ang=angleBetween(next,prev);
   const x=p.x*C+C/2,y=p.y*C+C/2;
   const r=C*.39;
   ctx.save();ctx.translate(x,y);ctx.rotate(ang);
   ctx.fillStyle=(i%2)?"#e8bc84":"#f2cb98";
   ctx.strokeStyle="#7d4d2b";ctx.lineWidth=2.5;
   ctx.beginPath();ctx.ellipse(0,0,r*1.12,r*.72,0,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle="rgba(255,255,255,.40)";
   ctx.beginPath();ctx.ellipse(-3,-5,r*.50,r*.23,0,0,Math.PI*2);ctx.fill();
   ctx.restore();
 }

 // head is deliberately larger and slightly overlaps first body segment
 const hp=posFor(0,t),hx=hp.x*C+C/2,hy=hp.y*C+C/2;
 const headScale=1.48;
 const headAngle=Math.atan2(dir.y,dir.x);
 ctx.save();ctx.translate(hx,hy);ctx.rotate(headAngle);
 // soft shadow
 ctx.globalAlpha=.16;ctx.fillStyle="#6f4527";ctx.beginPath();ctx.ellipse(0,12,25,13,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 // bigger Chihuahua head
 ctx.drawImage(dog,-31,-34,62,62);
 ctx.restore();

 // happy marks
 ctx.strokeStyle="#f4b62b";ctx.lineWidth=4;ctx.lineCap="round";
 ctx.beginPath();
 ctx.moveTo(hx+14,hy-22);ctx.lineTo(hx+21,hy-33);
 ctx.moveTo(hx+25,hy-11);ctx.lineTo(hx+37,hy-16);
 ctx.stroke();
}
function drawBone(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.rotate(-.25);ctx.scale(s,s);
 ctx.strokeStyle="#8b5a32";ctx.lineWidth=5;ctx.fillStyle="#fff0d5";
 ctx.beginPath();ctx.moveTo(-13,8);ctx.lineTo(13,-8);ctx.stroke();
 [[-14,9],[-18,4],[14,-9],[18,-4]].forEach(([a,b])=>{
  ctx.beginPath();ctx.arc(a,b,7,0,Math.PI*2);ctx.fill();ctx.stroke();
 });ctx.restore();
}
function end(){
 running=false;dead=true;
 titleEl.textContent="🐶 嗚嗚！撞到了";
 p1.textContent=`最後得分：${score}　｜　吉娃娃長度：${snake.length}`;
 p2.textContent="再試一次，看能不能吃更多骨頭！";
 document.getElementById("startBtn").textContent="重新開始";
 overlay.style.display="flex";
}
function beep(){
 try{
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=620;g.gain.value=.035;o.connect(g);g.connect(ac.destination);
  o.start();o.stop(ac.currentTime+.08);
 }catch(e){}
}
document.querySelectorAll(".ctrl").forEach(b=>{
 b.addEventListener("pointerdown",e=>{e.preventDefault();setDir(b.dataset.dir);if(!running)start()});
});
document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 const m={arrowup:"up",w:"up",arrowdown:"down",s:"down",arrowleft:"left",a:"left",arrowright:"right",d:"right"};
 if(m[k]){e.preventDefault();setDir(m[k]);if(!running)start()}
});
document.getElementById("startBtn").onclick=()=>{reset();start()};
document.getElementById("restartBtn").onclick=()=>{reset();start()};

let sx=0,sy=0;
canvas.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});
canvas.addEventListener("touchend",e=>{
 const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
 setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"));
 if(!running)start();
},{passive:true});

reset();
</script>
